<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />

  <!-- ✅ Mobile + PWA ready -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />

  <!-- ✅ SEO -->
  <title>Dial Mate — Shopify Order Confirmation Calls</title>
  <meta name="description" content="Automate Shopify COD order confirmations with AI-powered Urdu voice calls. Reduce fake orders and improve delivery success." />

  <!-- ✅ Favicon -->
  <link rel="icon" href="/favicon.ico" />

  <!-- ✅ Tailwind CDN (dev only — later move to build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          boxShadow: {
            soft: 'var(--shadow-sm)',
            medium: 'var(--shadow-md)',
            large: 'var(--shadow-lg)'
          },
          borderRadius: {
            sm: 'var(--radius-sm)',
            md: 'var(--radius-md)',
            lg: 'var(--radius-lg)'
          },
          transitionDuration: {
            fast: '150ms',
            smooth: '280ms'
          }
        }
      }
    };
  </script>

  <!-- ✅ Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- ✅ Font override -->
  <style>
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Montserrat', sans-serif !important;
    }

    body, p, span, div, a, li, td, th, input, button, textarea, select {
      font-family: 'Outfit', sans-serif !important;
    }
  </style>

  <!-- ✅ App styles -->
  <link rel="stylesheet" href="./styles/main.css" />

</head>

<body class="h-full bg-[hsl(var(--background))] text-[hsl(var(--foreground))] antialiased">

  <!-- ✅ Root -->
  <div id="root"></div>

  <!-- ✅ App -->
  <script type="module" src="./src/main.js"></script>

</body>
</html>
